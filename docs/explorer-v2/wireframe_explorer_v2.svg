<svg viewBox="0 0 1480 1180" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="1480" height="1180" fill="#ffffff"/>

  <!-- ============ callout dot helper style ============ -->
  <style>
    .cd { fill:#e11d48; }
    .cn { fill:#ffffff; font-size:12px; font-weight:700; text-anchor:middle; }
    .lbl { font-size:11px; fill:#475569; }
    .sec { font-size:13px; font-weight:700; fill:#0f172a; }
    .fld { font-size:12px; fill:#1e293b; }
    .badge { font-size:9px; fill:#94a3b8; }
    .muted { font-size:10px; fill:#94a3b8; }
  </style>

  <text x="30" y="30" font-size="19" font-weight="700" fill="#0f172a">BiTool Explorer v2 — anatomia fiel ao Looker Explore (mapeada p/ Cube.js)</text>

  <!-- ================= TOP BAR ================= -->
  <rect x="30" y="48" width="1420" height="56" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="48" y="84" font-size="20" font-weight="700" fill="#0f172a">Explorer</text>

  <!-- top-right meta -->
  <text x="900" y="72" class="lbl" text-anchor="end">500 linhas · 4.31s ·</text>
  <text x="905" y="72" class="lbl">agora há pouco · America/Sao_Paulo</text>
  <text x="905" y="90" font-size="10" fill="#2563eb">Ver detalhes de performance</text>
  <rect x="1230" y="60" width="70" height="32" fill="#ffffff" stroke="#2563eb" stroke-width="1.5" rx="5"/>
  <text x="1265" y="81" font-size="13" font-weight="700" fill="#2563eb" text-anchor="middle">Run</text>
  <circle cx="1340" cy="76" r="13" fill="#ffffff" stroke="#94a3b8"/>
  <text x="1340" y="81" font-size="14" text-anchor="middle" fill="#475569">⚙</text>

  <!-- callouts 1-5 -->
  <circle cx="760" cy="66" r="10" class="cd"/><text x="760" y="70" class="cn">1</text>
  <circle cx="1010" cy="66" r="10" class="cd"/><text x="1010" y="70" class="cn">2</text>
  <circle cx="1150" cy="66" r="10" class="cd"/><text x="1150" y="70" class="cn">3</text>
  <circle cx="1265" cy="44" r="10" class="cd"/><text x="1265" y="48" class="cn">4</text>
  <circle cx="1340" cy="44" r="10" class="cd"/><text x="1340" y="48" class="cn">5</text>

  <!-- ================= LEFT: FIELD PICKER ================= -->
  <rect x="30" y="104" width="360" height="900" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- domain name + quickstart bolt + collapse -->
  <text x="48" y="140" class="sec" font-size="15">Vendas</text>
  <text x="118" y="140" font-size="14" fill="#f59e0b">⚡</text>
  <circle cx="368" cy="134" r="11" fill="#ffffff" stroke="#94a3b8"/><text x="368" y="139" font-size="12" text-anchor="middle" fill="#475569">‹</text>
  <circle cx="150" cy="128" r="9" class="cd"/><text x="150" y="132" class="cn">6</text>

  <!-- find a field + search options -->
  <text x="48" y="168" class="fld" font-weight="700">Encontrar um campo</text>
  <text x="342" y="168" font-size="11" fill="#2563eb" text-anchor="end">Opções de busca</text>
  <rect x="48" y="178" width="294" height="32" fill="#ffffff" stroke="#94a3b8" rx="5"/>
  <text x="62" y="199" class="muted">🔍  Comece a digitar para buscar...</text>

  <!-- tabs All Fields / In Use -->
  <text x="110" y="240" font-size="13" fill="#2563eb" font-weight="700" text-anchor="middle">Todos os campos</text>
  <rect x="48" y="248" width="124" height="3" fill="#2563eb"/>
  <text x="285" y="240" font-size="13" fill="#64748b" text-anchor="middle">Em uso</text>
  <line x1="48" y1="251" x2="360" y2="251" stroke="#e2e8f0"/>
  <circle cx="150" cy="270" r="9" class="cd"/><text x="150" y="274" class="cn">7</text>

  <!-- domain groups -->
  <g>
    <text x="60" y="292" class="fld" font-weight="700">▸ Campos personalizados</text>
    <text x="342" y="292" font-size="11" fill="#2563eb" text-anchor="end">+ Adicionar</text>

    <text x="60" y="322" class="fld" font-weight="700">▸ Suporte</text>

    <!-- expanded Vendas domain -->
    <rect x="48" y="336" width="294" height="24" fill="#f1f5f9"/>
    <text x="60" y="353" class="fld" font-weight="700">▾ Vendas</text>
    <text x="330" y="353" font-size="11" fill="#2563eb" text-anchor="end">2</text>

    <text x="72" y="380" class="badge" font-weight="700" fill="#64748b">FILTER-ONLY FIELDS</text>
    <text x="80" y="400" class="fld">Data Venda (granularidade)</text>

    <text x="72" y="426" class="badge" font-weight="700" fill="#64748b">DIMENSÕES</text>
    <text x="80" y="446" class="fld">▸ Produto</text>
    <rect x="72" y="454" width="270" height="22" fill="#e0e7ff"/>
    <text x="80" y="470" class="fld">Regiao</text>
    <!-- hover icons on the selected dimension row -->
    <text x="250" y="470" font-size="12" fill="#475569">⤢</text>
    <text x="272" y="470" font-size="12" fill="#475569">▼</text>
    <text x="294" y="470" font-size="12" fill="#475569">ⓘ</text>
    <text x="316" y="470" font-size="12" fill="#475569">⋮</text>
    <text x="80" y="494" class="fld">Departamento</text>
    <text x="80" y="518" class="fld">ID</text>

    <text x="72" y="546" class="badge" font-weight="700" fill="#64748b">MEASURES</text>
    <rect x="72" y="554" width="270" height="22" fill="#fdeee0"/>
    <text x="80" y="570" class="fld">Receita Total</text>
    <text x="80" y="594" class="fld">Ticket Medio</text>
    <text x="80" y="618" class="fld">Count</text>

    <text x="60" y="650" class="fld" font-weight="700">▸ Usuarios</text>

    <!-- callout 6b: hover icons -->
    <circle cx="230" cy="463" r="9" class="cd"/><text x="230" y="467" class="cn">A</text>
  </g>

  <!-- footer -->
  <line x1="30" y1="968" x2="390" y2="968" stroke="#e2e8f0"/>
  <text x="48" y="990" class="muted">63 campos | 63 exibidos</text>
  <text x="342" y="990" font-size="11" fill="#2563eb" text-anchor="end">Ir para camada semântica</text>

  <!-- ================= RIGHT: 3 SECTIONS ================= -->
  <!-- FILTERS (expanded, dark header) -->
  <rect x="406" y="118" width="1044" height="30" fill="#1e293b" rx="4"/>
  <text x="424" y="138" font-size="13" font-weight="700" fill="#ffffff">▾ Filters</text>
  <circle cx="470" cy="133" r="9" class="cd"/><text x="470" y="137" class="cn">8</text>

  <rect x="406" y="152" width="1044" height="150" fill="#ffffff" stroke="#e2e8f0"/>
  <!-- AND rail -->
  <rect x="426" y="172" width="46" height="22" fill="#eef2ff" rx="4"/>
  <text x="449" y="188" font-size="11" fill="#2563eb" text-anchor="middle" font-weight="700">AND</text>
  <line x1="484" y1="172" x2="484" y2="264" stroke="#cbd5e1"/>

  <!-- filter row 1 -->
  <text x="500" y="188" font-size="12" fill="#475569">⚙ Vendas Data Venda</text>
  <rect x="700" y="174" width="150" height="26" fill="#ffffff" stroke="#94a3b8" rx="4"/>
  <text x="710" y="191" font-size="11" fill="#475569">está no ano ▾</text>
  <rect x="858" y="174" width="90" height="26" fill="#ffffff" stroke="#94a3b8" rx="4"/>
  <text x="868" y="191" font-size="11" fill="#475569">2025</text>
  <text x="964" y="191" font-size="13" fill="#94a3b8">✕</text>

  <!-- filter row 2 -->
  <text x="500" y="228" font-size="12" fill="#475569">⚙ Vendas Regiao</text>
  <rect x="700" y="214" width="90" height="26" fill="#ffffff" stroke="#94a3b8" rx="4"/>
  <text x="710" y="231" font-size="11" fill="#475569">é ▾</text>
  <rect x="800" y="214" width="120" height="26" fill="#eef2ff" stroke="#c7d2fe" rx="4"/>
  <text x="810" y="231" font-size="11" fill="#2563eb">BR-SP ✕</text>
  <text x="964" y="231" font-size="13" fill="#94a3b8">✕</text>

  <!-- add filter + group buttons -->
  <rect x="500" y="256" width="90" height="26" fill="#ffffff" stroke="#2563eb" rx="4"/>
  <text x="545" y="273" font-size="11" fill="#2563eb" text-anchor="middle">+ Filtro</text>
  <rect x="426" y="290" width="120" height="26" fill="#ffffff" stroke="#2563eb" rx="4"/>
  <text x="486" y="307" font-size="11" fill="#2563eb" text-anchor="middle">+ Novo grupo</text>
  <rect x="558" y="290" width="170" height="26" fill="#ffffff" stroke="#2563eb" rx="4"/>
  <text x="643" y="307" font-size="11" fill="#2563eb" text-anchor="middle">+ Expressão personalizada</text>

  <!-- VISUALIZATION (expanded, dark header w/ chart-type bar) -->
  <rect x="406" y="330" width="1044" height="30" fill="#1e293b" rx="4"/>
  <text x="424" y="350" font-size="13" font-weight="700" fill="#ffffff">▾ Visualization</text>
  <!-- chart type icons -->
  <g font-size="13" fill="#cbd5e1">
    <text x="640" y="350">▦</text><text x="670" y="350">▤</text><text x="700" y="350">▥</text>
    <text x="730" y="350">◕</text><text x="760" y="350">╱</text>
  </g>
  <rect x="792" y="336" width="94" height="18" fill="#334155" rx="3"/>
  <text x="839" y="350" font-size="11" fill="#ffffff" text-anchor="middle">Single Value</text>
  <text x="906" y="350" font-size="13" fill="#cbd5e1">···</text>
  <text x="1300" y="350" font-size="12" fill="#cbd5e1">⤳ Forecast</text>
  <text x="1410" y="350" font-size="12" fill="#cbd5e1" text-anchor="end">⚌ Edit</text>
  <circle cx="470" cy="345" r="9" class="cd"/><text x="470" y="349" class="cn">9</text>

  <rect x="406" y="364" width="1044" height="150" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="928" y="450" font-size="34" font-weight="700" fill="#0f172a" text-anchor="middle">6.645</text>
  <text x="928" y="478" class="muted" text-anchor="middle">[ render da visualização escolhida a partir dos dados ]</text>

  <!-- DATA SECTION (dark bar w/ sub-tabs) -->
  <rect x="406" y="524" width="1044" height="30" fill="#1e293b" rx="4"/>
  <text x="424" y="544" font-size="13" font-weight="700" fill="#ffffff">▾ Data</text>
  <rect x="486" y="528" width="80" height="22" fill="#475569" rx="3"/>
  <text x="526" y="544" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">Results</text>
  <text x="600" y="544" font-size="12" fill="#cbd5e1">SQL</text>
  <rect x="646" y="528" width="150" height="22" fill="#334155" rx="3"/>
  <text x="721" y="544" font-size="12" fill="#ffffff" text-anchor="middle">+ Adicionar cálculo</text>
  <text x="1230" y="544" font-size="11" fill="#cbd5e1">Row Limit</text>
  <rect x="1295" y="530" width="54" height="20" fill="#ffffff" rx="3"/><text x="1322" y="544" font-size="11" fill="#0f172a" text-anchor="middle">500</text>
  <rect x="1362" y="532" width="14" height="14" fill="#ffffff" stroke="#94a3b8"/>
  <text x="1382" y="544" font-size="11" fill="#cbd5e1">Totais</text>
  <circle cx="470" cy="539" r="9" class="cd"/><text x="470" y="543" class="cn">10</text>

  <!-- warning banner -->
  <rect x="406" y="558" width="1044" height="28" fill="#fef9c3" stroke="#fde68a"/>
  <text x="424" y="576" font-size="11" fill="#92400e">⚠ Limite de linhas atingido. Resultados podem estar incompletos.</text>
  <text x="1436" y="576" font-size="12" fill="#92400e" text-anchor="end">✕</text>

  <!-- results table -->
  <rect x="406" y="590" width="1044" height="380" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="406" y="590" width="720" height="26" fill="#dbe4f0"/>
  <rect x="1126" y="590" width="324" height="26" fill="#f6e2ce"/>
  <text x="440" y="607" font-size="11" font-weight="700" fill="#334155">Vendas Data Venda  ⇅</text>
  <text x="1094" y="607" font-size="12" fill="#475569" text-anchor="end">⚙</text>
  <text x="1150" y="607" font-size="11" font-weight="700" fill="#334155">Vendas Count</text>
  <text x="1436" y="607" font-size="12" fill="#475569" text-anchor="end">⚙</text>
  <g font-size="11" fill="#334155">
    <text x="418" y="636">1</text><text x="440" y="636">2025-10-17</text><text x="1436" y="636" text-anchor="end">9</text>
    <text x="418" y="662">2</text><text x="440" y="662">2025-10-16</text><text x="1436" y="662" text-anchor="end">14</text>
    <text x="418" y="688">3</text><text x="440" y="688">2025-10-15</text><text x="1436" y="688" text-anchor="end">26</text>
    <text x="418" y="714">4</text><text x="440" y="714">2025-10-14</text><text x="1436" y="714" text-anchor="end">22</text>
  </g>
  <!-- drill hint -->
  <rect x="1360" y="700" width="120" height="0" />
  <circle cx="1400" cy="710" r="9" class="cd"/><text x="1400" y="714" class="cn">B</text>
  <text x="1348" y="742" class="muted" text-anchor="end">clique numa célula → drill-down</text>

  <!-- ================= LEGEND ================= -->
  <rect x="30" y="1020" width="1420" height="150" fill="#f8fafc" stroke="#e2e8f0" rx="6"/>
  <text x="48" y="1046" class="sec">Legenda da anatomia</text>
  <g font-size="11.5" fill="#334155">
    <text x="48" y="1070">1 · Contagem de linhas + tempo da query + "Ver detalhes de performance"</text>
    <text x="48" y="1090">2 · Idade dos dados (hover mostra data/hora exata)</text>
    <text x="48" y="1110">3 · Time Zone selecionável</text>
    <text x="48" y="1130">4 · Botão Run (executa / re-executa a query)</text>
    <text x="48" y="1150">5 · Menu de engrenagem "Ações" (Salvar, Download, Compartilhar, Obter SQL/semantic, Combinar, Limpar cache...)</text>
    <text x="760" y="1070">6 · Nome do Domain + ⚡ Quick Start + colapsar painel · A · ícones de hover (pivot ⤢, filtrar ▼, info ⓘ, mais ⋮)</text>
    <text x="760" y="1090">7 · Abas "Todos os campos" / "Em uso"</text>
    <text x="760" y="1110">8 · Seção Filters (builder: campo → operador → valor, AND/OR, grupos, expressão)</text>
    <text x="760" y="1130">9 · Seção Visualization (barra de tipos de gráfico + render) · 10 · Seção Data (abas Results | SQL | + cálculo, Row Limit, Totais)</text>
    <text x="760" y="1150">B · Drill-down ao clicar numa célula da tabela</text>
  </g>
</svg>
